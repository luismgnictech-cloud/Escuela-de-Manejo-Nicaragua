<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Validación responsive · Escuela de Manejo</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9eef2;color:#173a50;font:15px system-ui,sans-serif}header{padding:16px 24px;background:#fff;border-bottom:1px solid #ccd9e1}h1{font-size:20px;margin:0 0 8px}p{margin:8px 0;color:#506875}label{margin-right:14px;display:inline-block}select{font:inherit;padding:6px;border:1px solid #b7c8d3;border-radius:6px}main{padding:20px;overflow:auto}.frame{margin:0 auto;width:390px;background:#fff;box-shadow:0 3px 20px #173a5026}iframe{display:block;border:0;width:100%;height:720px}output{font-weight:700}
</style></head><body><header><h1>Validación responsive</h1><p>El sitio real se carga dentro de un marco del ancho seleccionado. Esta prueba revisa la interfaz; no emula Android ni valida maniobras viales.</p><label>Ancho <select id="width"><option>320</option><option>360</option><option selected>390</option><option>430</option><option>768</option></select> px</label><label>Página <select id="page"><option value="">Inicio</option><option value="#rg-routes">Rotondas · guía</option><option value="#mapa-bello-horizonte" selected>Rotondas · Managua</option><option value="#guias">Todas las guías</option><option value="#guia-intersecciones">Intersecciones</option><option value="#guia-prioridad">Prioridad</option><option value="#guia-giros">Giros</option><option value="#guia-senales">Señales</option><option value="#guia-puntos-ciegos">Puntos ciegos</option><option value="#guia-estacionamiento">Estacionamiento</option><option value="#guia-distancia">Distancia</option></select></label><output id="status">390 px</output></header><main><div class="frame" id="frame"><iframe id="site" title="Sitio de Escuela de Manejo en el ancho seleccionado" src="./#mapa-bello-horizonte"></iframe></div></main><script>
const width=document.getElementById('width'),page=document.getElementById('page'),frame=document.getElementById('frame'),site=document.getElementById('site'),status=document.getElementById('status');
width.addEventListener('change',()=>{frame.style.width=width.value+'px';status.textContent=width.value+' px';});
page.addEventListener('change',()=>{site.src='./'+page.value;});
</script></body></html>
